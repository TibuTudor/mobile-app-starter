services:
  # ── MySQL 8.0 ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      # Host port is configurable via DB_HOST_PORT in .env (default 3307). Container port stays 3306.
      - "${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Laravel API ────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      # Host port is configurable via API_HOST_PORT in .env (default 8000). Container port stays 8000.
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://${HOST_IP}:${API_HOST_PORT:-8000}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:${API_HOST_PORT:-8000},${HOST_IP},${HOST_IP}:${API_HOST_PORT:-8000}"

  # ── phpMyAdmin ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      # Host port is configurable via PMA_HOST_PORT in .env (default 8090). Container port stays 80.
      - "${PMA_HOST_PORT:-8090}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

  # ── Expo / Metro bundler ───────────────────────────────────
  mobile:
    build: ./mobile
    restart: unless-stopped
    tty: true
    ports:
      # Metro must be symmetric (host port == container port) so the device can reach the exact
      # address the QR code advertises. Configurable via METRO_HOST_PORT in .env (default 8081).
      - "${METRO_HOST_PORT:-8081}:${METRO_HOST_PORT:-8081}"
    depends_on:
      - backend
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP}
      # Port Metro binds inside the container; the entrypoint passes it to `expo start --port`.
      RCT_METRO_PORT: ${METRO_HOST_PORT:-8081}
      EXPO_PUBLIC_API_URL: http://${HOST_IP}:${API_HOST_PORT:-8000}/api

volumes:
  db_data:
  backend_vendor:
  backend_storage:
  mobile_node_modules:
